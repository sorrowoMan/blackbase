services:
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --protected-mode
      - "no"
    ports:
      # Development-only endpoint.  Do not remove the host IP: publishing
      # "6379:6379" exposes an unauthenticated Redis service on every NIC.
      - "127.0.0.1:6379:6379"
    volumes:
      - blackbase_redis_local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20
    restart: unless-stopped

volumes:
  blackbase_redis_local:
